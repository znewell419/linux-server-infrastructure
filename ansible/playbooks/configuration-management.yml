---
- name: Manage server configuration
  hosts: servers
  become: true
  gather_facts: false

  tasks:
    - name: Create Ansible configuration file
      ansible.builtin.copy:
        content: |
          # This file is managed by Ansible.
          # Do not edit manually.

          Server managed by ansible.
        dest: /etc/ansible-managed.conf
        owner: root
        group: root
        mode: '0644'
